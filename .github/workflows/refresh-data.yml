name: Refresh MTG data

# Daily plus on demand. Daily is the useful ceiling: Scryfall's bulk exports
# (prices included) refresh about once a day, so running more often can't get
# fresher data. See https://scryfall.com/docs/api/bulk-data.
#
# Failure policy: Scryfall problems stop the run and change nothing, so the
# repo keeps yesterday's good data. A Spellbook outage only skips the combo
# refresh; cards, prices, rulings, and tags still update.
on:
  schedule:
    - cron: '0 10 * * *'   # ~10:00 UTC (GitHub may start scheduled runs late under load)
  workflow_dispatch: {}     # "Run workflow" button / API dispatch

permissions:
  contents: write

concurrency:                # a manual run and the daily run never overlap
  group: refresh-data
  cancel-in-progress: false

env:
  UA: "mtg-data-refresh/1.0 (github.com/LilBeaky/mtg-data)"

jobs:
  refresh:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to a new image on 2026-10-19
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install ijson

      - name: Resolve Scryfall bulk-data URLs
        id: urls
        # Scryfall requires a User-Agent and an Accept header. One call to the
        # /bulk-data list covers every type. Failures print the real HTTP status.
        run: |
          set -euo pipefail
          status=$(curl -s -o /tmp/bulk.json -w '%{http_code}' \
            -H "User-Agent: ${UA}" -H "Accept: application/json" \
            https://api.scryfall.com/bulk-data)
          if [ "$status" != "200" ]; then
            echo "::error::Scryfall /bulk-data returned HTTP ${status}"
            head -c 500 /tmp/bulk.json || true
            exit 1
          fi
          echo "::notice::Available bulk types: $(jq -r '[.data[].type] | join(", ")' /tmp/bulk.json)"
          # Prefer jsonl_download_uri (Scryfall's current format); treat null as missing.
          for type in oracle_cards default_cards rulings oracle_tags; do
            url=$(jq -r --arg t "$type" '.data[] | select(.type==$t) | (.jsonl_download_uri // .download_uri // empty)' /tmp/bulk.json)
            if [ -z "$url" ]; then
              if [ "$type" = "oracle_tags" ]; then
                echo "::warning::oracle_tags missing from Scryfall's list; keeping existing tags file."
                continue
              fi
              echo "::error::Required bulk-data type '${type}' not in Scryfall's list"
              exit 1
            fi
            echo "::notice::${type} -> ${url}"
            echo "${type}_url=${url}" >> "$GITHUB_OUTPUT"
          done

      - name: Download Scryfall bulk files
        run: |
          set -uo pipefail
          fetch() {
            curl -sfL --retry 3 --retry-delay 20 --compressed -A "$UA" "$1" -o "$2"
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "::error::Download failed (curl exit ${rc}) for $2 from $1"
              exit 1
            fi
            # Scryfall serves real .jsonl.gz files; --compressed doesn't unpack those.
            if gzip -t "$2" 2>/dev/null; then
              mv "$2" "$2.gz" && gunzip "$2.gz"
            fi
            echo "::notice::$2 -> $(du -h "$2" | cut -f1)"
          }
          fetch "${{ steps.urls.outputs.oracle_cards_url }}" /tmp/oracle-cards.json
          fetch "${{ steps.urls.outputs.default_cards_url }}" /tmp/default-cards.json
          fetch "${{ steps.urls.outputs.rulings_url }}" /tmp/rulings.jsonl
          if [ -n "${{ steps.urls.outputs.oracle_tags_url }}" ]; then
            fetch "${{ steps.urls.outputs.oracle_tags_url }}" /tmp/oracle-tags.jsonl
          fi

      - name: Trim Scryfall cards + prices
        run: python3 scripts/trim.py scryfall /tmp/oracle-cards.json /tmp/trimmed_scryfall_v2.json --prices /tmp/default-cards.json

      - name: Sanity-check Scryfall data
        # Floors sit well below today's numbers (~34.6k cards, ~33k priced,
        # ~26 MB rulings, ~18 MB tags) so they only trip on a broken download
        # or a Scryfall format change, never on normal growth.
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json, os, sys
          cards = json.load(open("/tmp/trimmed_scryfall_v2.json"))
          priced = sum(1 for c in cards if "usd" in c)
          print(f"cards: {len(cards):,} | priced: {priced:,}")
          bad = []
          if len(cards) < 25000: bad.append(f"only {len(cards)} cards")
          if priced < 20000: bad.append(f"only {priced} priced cards (price format change?)")
          if os.path.getsize("/tmp/rulings.jsonl") < 5_000_000: bad.append("rulings file too small")
          if os.path.exists("/tmp/oracle-tags.jsonl") and os.path.getsize("/tmp/oracle-tags.jsonl") < 5_000_000:
              bad.append("oracle tags file too small")
          for b in bad: print(f"::error::{b} - aborting without committing")
          sys.exit(1 if bad else 0)
          PY

      - name: Refresh Commander Spellbook combos (non-fatal)
        id: spellbook
        run: |
          set -uo pipefail
          if ! curl -sfL --retry 3 --retry-delay 20 -A "$UA" https://json.commanderspellbook.com/variants.json.gz -o /tmp/variants.json.gz; then
            echo "::warning::Spellbook download failed; keeping existing combo data."
            exit 0
          fi
          if ! python3 scripts/trim.py spellbook /tmp/variants.json.gz /tmp/spellbook_combos.json.gz; then
            echo "::warning::Spellbook trim failed; keeping existing combo data."
            exit 0
          fi
          n=$(python3 -c "import gzip,json; print(len(json.load(gzip.open('/tmp/spellbook_combos.json.gz','rt'))['variants']))")
          if [ "$n" -lt 50000 ]; then
            echo "::warning::Only ${n} combos (normally ~109k); keeping existing combo data."
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Update data/ files
        run: |
          set -euo pipefail
          mv /tmp/trimmed_scryfall_v2.json data/trimmed_scryfall_v2.json
          if [ "${{ steps.spellbook.outputs.ok }}" = "true" ]; then
            mv /tmp/spellbook_combos.json.gz data/spellbook_combos.json.gz
          fi

          # Dated files are named with Scryfall's own export timestamp, and only
          # replaced when the content actually changed, so an unchanged file is
          # never renamed (which would make a pointless commit).
          replace_dated() {  # replace_dated NEW_FILE PREFIX SOURCE_URL
            local new="$1" prefix="$2" url="$3" old ts
            old=$(ls data/${prefix}-*.jsonl 2>/dev/null | head -n1 || true)
            if [ -n "$old" ] && cmp -s "$new" "$old"; then
              echo "${prefix}: unchanged"; return
            fi
            ts=$(basename "$url" | grep -oE '[0-9]{14}' | head -n1 || true)
            [ -n "$ts" ] || ts=$(date -u +%Y%m%d%H%M%S)
            rm -f data/${prefix}-*.jsonl
            mv "$new" "data/${prefix}-${ts}.jsonl"
            echo "${prefix}: updated -> ${prefix}-${ts}.jsonl"
          }
          replace_dated /tmp/rulings.jsonl rulings "${{ steps.urls.outputs.rulings_url }}"
          if [ -f /tmp/oracle-tags.jsonl ]; then
            replace_dated /tmp/oracle-tags.jsonl oracle-tags "${{ steps.urls.outputs.oracle_tags_url }}"
          fi

          # Freshness info read by mtg.py: price date on cost lines, and a
          # warning in every session if the refresh stops running.
          jq -n \
            --arg refreshed "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg prices "$(jq -r '.data[] | select(.type=="default_cards") | .updated_at' /tmp/bulk.json)" \
            --arg cards "$(jq -r '.data[] | select(.type=="oracle_cards") | .updated_at' /tmp/bulk.json)" \
            --arg combos_refreshed "${{ steps.spellbook.outputs.ok == 'true' }}" \
            '{refreshed_at: $refreshed, prices_as_of: $prices, cards_as_of: $cards,
              spellbook_refreshed_this_run: ($combos_refreshed == "true")}' > data/data_info.json

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "mtg-data-refresh-bot"
          git config user.email "actions@mtg-data.invalid"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No changes - nothing to commit."
            exit 0
          fi
          git commit -q -m "Automated data refresh: $(date -u +%Y-%m-%d)"
          # Someone may have pushed during the run; rebase onto it and retry.
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q && exit 0
            sleep 10
          done
          echo "::error::Push failed after 3 attempts"
          exit 1
