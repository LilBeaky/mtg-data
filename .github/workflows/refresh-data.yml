name: Refresh MTG data

# Runs daily and on demand. Daily is the ceiling that actually matters:
# Scryfall's own bulk exports (including prices) only refresh on their end
# roughly once every 24 hours, so pulling more often than this can't get
# fresher data - see https://scryfall.com/docs/api/bulk-data.
on:
  schedule:
    - cron: '0 10 * * *'   # ~10:00 UTC daily, comfortably after Scryfall's typical rotation
  workflow_dispatch: {}     # manual "Run workflow" button for on-demand refreshes

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install ijson

      - name: Resolve Scryfall bulk-data URLs
        id: urls
        # Scryfall requires a descriptive User-Agent and an Accept header on
        # API requests. One call to the /bulk-data list covers every type, and
        # a failure prints the real HTTP status instead of failing silently.
        run: |
          set -euo pipefail
          UA="mtg-data-refresh/1.0 (github.com/LilBeaky/mtg-data)"
          status=$(curl -s -o /tmp/bulk.json -w '%{http_code}' \
            -H "User-Agent: ${UA}" -H "Accept: application/json" \
            https://api.scryfall.com/bulk-data)
          if [ "$status" != "200" ]; then
            echo "::error::Scryfall /bulk-data returned HTTP ${status}"
            head -c 500 /tmp/bulk.json || true
            exit 1
          fi
          echo "::notice::Available bulk types: $(jq -r '[.data[].type] | join(", ")' /tmp/bulk.json)"

          for type in oracle_cards default_cards rulings; do
            url=$(jq -r --arg t "$type" '.data[] | select(.type==$t) | (.jsonl_download_uri // .download_uri // empty)' /tmp/bulk.json)
            if [ -z "$url" ]; then
              echo "::error::Required bulk-data type '${type}' not in Scryfall's list"
              exit 1
            fi
            echo "::notice::${type} -> ${url}"
            echo "${type}_url=${url}" >> "$GITHUB_OUTPUT"
          done

          # oracle_tags isn't in Scryfall's public bulk-data docs. Use it if the
          # list includes it; otherwise warn and keep the existing file.
          tags_url=$(jq -r '.data[] | select(.type=="oracle_tags") | (.jsonl_download_uri // .download_uri // empty)' /tmp/bulk.json)
          if [ -n "$tags_url" ]; then
            echo "oracle_tags: found"
            echo "tags_url=${tags_url}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::oracle_tags not in Scryfall's bulk list - data/oracle-tags-*.jsonl not refreshed this run."
          fi

      - name: Download Scryfall bulk files
        run: |
          set -uo pipefail
          UA="mtg-data-refresh/1.0 (github.com/LilBeaky/mtg-data)"
          fetch() {
            curl -sfL --compressed -A "$UA" "$1" -o "$2"
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "::error::Download failed (curl exit ${rc}) for $2 from $1"
              exit 1
            fi
            # Scryfall now serves real .jsonl.gz files (not just gzip transfer
            # encoding), which --compressed doesn't unpack. Unzip if gzipped.
            if gzip -t "$2" 2>/dev/null; then
              mv "$2" "$2.gz" && gunzip "$2.gz"
            fi
            echo "::notice::$2 -> $(du -h "$2" | cut -f1)"
          }
          fetch "${{ steps.urls.outputs.oracle_cards_url }}" /tmp/oracle-cards.json
          fetch "${{ steps.urls.outputs.default_cards_url }}" /tmp/default-cards.json
          fetch "${{ steps.urls.outputs.rulings_url }}" /tmp/rulings.jsonl
          if [ -n "${{ steps.urls.outputs.tags_url }}" ]; then
            fetch "${{ steps.urls.outputs.tags_url }}" /tmp/oracle-tags.jsonl
          fi

      - name: Download Commander Spellbook combo data
        run: curl -sfL -A "mtg-data-refresh/1.0 (github.com/LilBeaky/mtg-data)" https://json.commanderspellbook.com/variants.json.gz -o /tmp/variants.json.gz

      - name: Trim Scryfall cards + prices
        run: |
          python3 scripts/trim.py scryfall /tmp/oracle-cards.json /tmp/trimmed_scryfall_v2.json --prices /tmp/default-cards.json

      - name: Sanity check before touching committed data
        # Guards against a truncated/bad download silently wiping out good
        # data. ~30k oracle cards exist today; floor is set well below that
        # so it only trips on an actual bad fetch, not normal card-count growth.
        run: |
          set -euo pipefail
          n=$(python3 -c "import json; print(len(json.load(open('/tmp/trimmed_scryfall_v2.json'))))")
          echo "trimmed card count: $n"
          if [ "$n" -lt 25000 ]; then
            echo "::error::Trimmed card count ($n) is suspiciously low - aborting without committing."
            exit 1
          fi

      - name: Trim Spellbook combos
        run: python3 scripts/trim.py spellbook /tmp/variants.json.gz /tmp/spellbook_combos.json.gz

      - name: Update data/ files
        run: |
          set -euo pipefail
          mv /tmp/trimmed_scryfall_v2.json data/trimmed_scryfall_v2.json
          mv /tmp/spellbook_combos.json.gz data/spellbook_combos.json.gz

          today=$(date -u +%Y%m%d%H%M%S)
          rm -f data/rulings-*.jsonl
          mv /tmp/rulings.jsonl "data/rulings-${today}.jsonl"

          if [ -f /tmp/oracle-tags.jsonl ]; then
            rm -f data/oracle-tags-*.jsonl
            mv /tmp/oracle-tags.jsonl "data/oracle-tags-${today}.jsonl"
          fi

      - name: Commit and push if anything changed
        run: |
          set -euo pipefail
          git config user.name "mtg-data-refresh-bot"
          git config user.email "actions@mtg-data.invalid"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes - nothing to commit."
            exit 0
          fi
          git commit -q -m "Automated data refresh: $(date -u +%Y-%m-%d)"
          git push
