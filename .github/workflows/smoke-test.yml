name: Smoke test

# Runs every tool against tests/test_deck.txt after each daily data refresh, on pushes that
# change the tools or their inputs, and on demand.
# A failure (or a run over 25 minutes) turns this run red and records it in tests/smoke_status.json, which mtg.py
# and audit.py surface as a warning in every session until a later run passes.
# The status file is only committed when the result changes, so passing days add no commits.

on:
  workflow_run:
    workflows: ["Refresh MTG data"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'fishpond/**'
      - 'tests/**'
      - '!tests/smoke_status.json'      # the bot's own status commit must not retrigger this
      - 'snapshots/**'
      - 'data/aliases.txt'
      - 'data/goldfish_overrides.json'
      - '.github/workflows/smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smoke-test
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35          # the smoke step stops itself at 25 (below), so a slow run is recorded as a failure, never a silent cancel
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main              # test what's on main now, including the refresh's own commit

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run smoke test
        id: smoke
        run: |
          set +e                                  # a failing test must still reach the status commit
          timeout 25m python3 tests/smoke.py --verbose --status tests/smoke_status.json > /tmp/smoke.txt 2>&1
          rc=$?
          cat /tmp/smoke.txt
          if [ "$rc" = "124" ]; then                # timed out: record it, so sessions see a failure instead of a stale pass
            echo "FAIL  smoke test timed out after 25 minutes" >> /tmp/smoke.txt
            python3 -c "import json,datetime; json.dump({'status':'fail','since':datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),'failures':['smoke test timed out after 25 minutes (last check finished: see the run log)']}, open('tests/smoke_status.json','w'), indent=1)"
          fi
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          grep -E '^FAIL' /tmp/smoke.txt | while read -r line; do echo "::error::${line}"; done
          exit 0

      - name: Record status change
        run: |
          set -euo pipefail
          git config user.name "mtg-data-smoke-bot"
          git config user.email "actions@mtg-data.invalid"
          git add tests/smoke_status.json
          if git diff --cached --quiet; then
            echo "Status unchanged - nothing to commit."; exit 0
          fi
          git commit -q -m "Smoke test: $(python3 -c "import json;print(json.load(open('tests/smoke_status.json'))['status'])") ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q && exit 0
            sleep 10
          done
          echo "::error::Push failed after 3 attempts"; exit 1

      - name: Fail the run if the smoke test failed
        if: steps.smoke.outputs.rc != '0'
        run: |
          echo "::error::Smoke test failed. See the FAIL lines above and tests/smoke_status.json."
          exit 1
